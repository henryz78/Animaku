name: Deploy Cloudflare Worker

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a database migration or run two production releases together.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || 'animaku' }}
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test deployment preparation
        run: node --test scripts/cloudflare-deploy.test.mjs

      - name: Typecheck and build
        run: pnpm build:cloudflare

      - name: Validate Worker bundle
        run: pnpm check:cloudflare

      - name: Prepare Worker and D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_NAME: ${{ vars.CLOUDFLARE_D1_NAME }}
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Validate prepared deployment
        run: pnpm exec wrangler deploy --config .tmp-cloudflare-deploy.json --keep-vars --dry-run

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # This temporary D1-only config must never be used for Worker deployment.
        run: pnpm exec wrangler d1 migrations apply DB --remote --config .tmp-cloudflare-d1.json

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config .tmp-cloudflare-deploy.json --keep-vars

      - name: Remove temporary deployment configuration
        if: always()
        run: rm -f -- .tmp-cloudflare-d1.json .tmp-cloudflare-deploy.json
